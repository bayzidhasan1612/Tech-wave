<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Wave</title>
    <link rel="stylesheet" href="styles/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="inter-font">
    <header class="bg-[#1A0B2E]">
      <nav class="flex justify-around items-center p-6">
        <h1 class="text-5xl font-bold">
          <span class="text-white">Tech</span
          ><span class="gradient-text">Wave</span>
        </h1>
        <div>
          <ul class="flex text-white gap-8">
            <li><a href="">About</a></li>
            <li><a href="">Episodes</a></li>
            <li><a href="">Host</a></li>
          </ul>
        </div>
        <button
          class="border-none text-white font-semibold bg-gradient-to-tr from-yellow-500 via-pink-500 to-violet-700 py-3 pr-6 pl-4 rounded-4xl cursor-pointer"
        >
          Subscribe <i class="fa-solid fa-arrow-right"></i>
        </button>
      </nav>
    </header>

    <main>
      <section>
        <div class="hero-image">
          <div class="flex justify-center items-center pt-24">
            <img class="cirle-img" src="assets/hero-circle.png" alt="" />
            <img class="microphone-img" src="assets/microphone.png" alt="" />
          </div>
          <div class="text-center text-white mt-10">
            <h1 class="text-6xl font-extrabold mb-2">TechWave</h1>
            <p class="opacity-80 mb-6">
              Your daily dose of tech insights, productivity hacks, and personal
              growth
            </p>
          </div>
          <div class="flex gap-2 justify-center">
            <button class=" flex justify-center items-center gap-2  text-white spotify-btn font-semibold bg-gradient-to-tr from-yellow-500 via-pink-500 to-violet-700 py-3 pr-6 pl-7 rounded-4xl cursor-pointer">
                <img class="spotify-icon block" src="assets/spotify.png" alt="Icon"><span>Listen on Spotify</span></button>
            <button class="sub-spotify flex items-center justify-center gap-2 font-semibold text-green-400 rounded-4xl py-3 pl-7 pr-5">
                <img src="assets/message.png" alt="">
                Subscribe
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
